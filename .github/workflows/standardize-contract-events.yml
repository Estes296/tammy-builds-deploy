name: Standardize Contract Inspector analytics events

on:
  push:
    paths:
      - '.github/workflows/standardize-contract-events.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical completion and output events
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.js')
          t=p.read_text(encoding='utf-8')
          old="trackEvent('analysis_completed',{mode:state.mode,scan_warning:Boolean(state.docA?.scanWarning||state.docB?.scanWarning)});"
          new="trackEvent('analysis_completed',{mode:state.mode,scan_warning:Boolean(state.docA?.scanWarning||state.docB?.scanWarning)});trackEvent('result_shown',{mode:state.mode});"
          if "trackEvent('result_shown'" not in t:
              if old not in t: raise SystemExit('analysis completion anchor not found')
              t=t.replace(old,new,1)
          old_print="trackEvent('report_printed',{mode:state.mode});window.print();"
          new_print="trackEvent('report_printed',{mode:state.mode});trackEvent('print_clicked',{mode:state.mode});window.print();"
          if "trackEvent('print_clicked'" not in t:
              if old_print not in t: raise SystemExit('print anchor not found')
              t=t.replace(old_print,new_print,1)
          old_export="trackEvent('json_exported',{mode:state.mode});"
          new_export="trackEvent('json_exported',{mode:state.mode});trackEvent('report_downloaded',{mode:state.mode,format:'json'});"
          if "trackEvent('report_downloaded'" not in t:
              if old_export not in t: raise SystemExit('export anchor not found')
              t=t.replace(old_export,new_export,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit event standardization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tammy Builds Automation'
          git config user.email 'rasha12273@gmail.com'
          git add src/main.js
          git commit -m 'Standardize Contract Inspector analytics events'
          git push
