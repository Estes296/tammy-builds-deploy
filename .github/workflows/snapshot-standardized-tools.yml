name: Snapshot standardized Tammy Builds tools

on:
  push:
    paths:
      - '.github/workflows/snapshot-standardized-tools.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public-safe snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sql-blast-radius cobol-xray vendor-price-creep-finder
          mkdir -p sql-blast-radius cobol-xray vendor-price-creep-finder
          curl -fsSL https://sql-blast-radius.netlify.app/ -o sql-blast-radius/index.html
          curl -fsSL https://cobol-xray.netlify.app/ -o cobol-xray/index.html
          curl -fsSL https://vendor-price-creep-finder.netlify.app/ -o vendor-price-creep-finder/index.html
          python - <<'PY'
          import re, urllib.request
          from pathlib import Path
          base='https://vendor-price-creep-finder.netlify.app'
          out=Path('vendor-price-creep-finder')
          text=(out/'index.html').read_text(encoding='utf-8')
          for path in sorted(set(re.findall(r'(/assets/[^\"\'\s>]+\.(?:js|css))', text))):
              target=out/path.lstrip('/')
              target.parent.mkdir(parents=True,exist_ok=True)
              with urllib.request.urlopen(base+path,timeout=30) as r: target.write_bytes(r.read())
          for path in ('/favicon.svg','/social-card.png'):
              try:
                  with urllib.request.urlopen(base+path,timeout=30) as r: (out/path.lstrip('/')).write_bytes(r.read())
              except Exception: pass
          PY
      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'actorbridge|actoros|finn[ _-]?local' sql-blast-radius cobol-xray vendor-price-creep-finder; then
            echo 'Blocked: private project reference found.' >&2
            exit 1
          fi
          for d in sql-blast-radius cobol-xray vendor-price-creep-finder; do
            grep -q 'tammy-builds-feedback' "$d/index.html"
            grep -q 'tool_opened' "$d/index.html"
            grep -q 'analysis_started' "$d/index.html"
            grep -q 'result_shown' "$d/index.html"
          done
      - name: Commit refreshed snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tammy Builds Automation'
          git config user.email 'rasha12273@gmail.com'
          git add sql-blast-radius cobol-xray vendor-price-creep-finder
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Refresh standardized Tammy Builds tool snapshots'
            git push
          fi
